<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Sign Up</title>
</head>
<body style="
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
    background-color: #fafafa;
    display: flex; 
    flex-direction: column;
    justify-content: center; 
    align-items: center; 
    min-height: 100vh;
    margin: 0;
    padding: 20px; 
    box-sizing: border-box;
">

    <div style="
        background-color: white; 
        border: 1px solid #dbdbdb; 
        border-radius: 1px; 
        padding: 15px 0; 
        width: 380px; 
        max-width: 100%;
        text-align: center;
        margin-bottom: 10px; 
    ">
        
        <img src="instagram.jpg" alt="Instagram Logo" style="
            height: 141px; 
            margin: 22px auto 25px auto; 
            display: block;
        ">

        <h2 style="
            color: #8e8e8e; 
            font-size: 17px; 
            font-weight: 600; 
            line-height: 20px; 
            margin: 0 40px 10px;
        ">
            Sign up to see photos and videos from your friends.
        </h2>
        
        <form action="#" method="POST" style="padding: 0 45px;"> 
            
            <button type="button" 
                style="
                    width: 100%; 
                    padding: 8px 0; 
                    background-color: #0095f6;
                    color: white; 
                    border: none; 
                    border-radius: 8px; 
                    font-size: 15px; 
                    font-weight: 600;
                    cursor: pointer;
                    margin-bottom: 18px; 
                    display: flex;
                    align-items: center;
                    justify-content: center;
                "
            >
                <span style="font-size: 19px; margin-right: 8px;">📘</span> Log in with Facebook
            </button>
            
            <div style="
                display: flex; 
                align-items: center; 
                margin: 12px 0 20px 0; 
            ">
                <hr style="flex-grow: 1; border: none; border-top: 1px solid #dbdbdb;">
                <p style="
                    margin: 0 18px; 
                    color: #8e8e8e; 
                    font-size: 13px; 
                    font-weight: 600;
                ">
                    OR
                </p>
                <hr style="flex-grow: 1; border: none; border-top: 1px solid #dbdbdb;">
            </div>
            
            <div style="margin-bottom: 8px;"> 
                <input type="text" placeholder="Mobile Number or Email" required 
                    style="
                        width: 100%; 
                        padding: 10px 10px; 
                        border: 1px solid #dbdbdb; 
                        border-radius: 3px; 
                        box-sizing: border-box; 
                        background-color: #fafafa;
                        font-size: 13px; 
                        line-height: 1.5; 
                        color: #262626;
                        outline: none; 
                    ">
            </div>

            <div style="margin-bottom: 8px;"> 
                <input type="text" placeholder="Full Name" required 
                    style="
                        width: 100%; 
                        padding: 10px 10px; 
                        border: 1px solid #dbdbdb; 
                        border-radius: 3px; 
                        box-sizing: border-box; 
                        background-color: #fafafa;
                        font-size: 13px; 
                        line-height: 1.5; 
                        color: #262626;
                        outline: none; 
                    ">
            </div>

            <div style="margin-bottom: 8px;"> 
                <input type="text" placeholder="Username" required 
                    style="
                        width: 100%; 
                        padding: 10px 10px; 
                        border: 1px solid #dbdbdb; 
                        border-radius: 3px; 
                        box-sizing: border-box; 
                        background-color: #fafafa;
                        font-size: 13px; 
                        line-height: 1.5; 
                        color: #262626;
                        outline: none; 
                    ">
            </div>

            <div style="margin-bottom: 16px;"> 
                <input type="password" placeholder="Password" required 
                    style="
                        width: 100%; 
                        padding: 10px 10px; 
                        border: 1px solid #dbdbdb; 
                        border-radius: 3px; 
                        box-sizing: border-box; 
                        background-color: #fafafa;
                        font-size: 13px; 
                        line-height: 1.5;
                        color: #262626;
                        outline: none;
                    ">
            </div>
            
            <p style="margin: 0 10px 15px; color: #8e8e8e; font-size: 12px; line-height: 1.5;">
                People who use our service may have uploaded your contact information to Instagram. **Learn More**
            </p>

            <button type="submit" 
                style="
                    width: 100%; 
                    padding: 8px 0; 
                    background-color: #0095f6;
                    color: white; 
                    border: none; 
                    border-radius: 8px; 
                    font-size: 15px; 
                    font-weight: 600;
                    cursor: pointer;
                    opacity: 0.7; 
                    margin-bottom: 18px; 
                    transition: opacity 0.3s;
                "
                onmouseover="this.style.opacity='1'"
                onmouseout="this.style.opacity='0.7'"
            >
                Sign up
            </button>
            
            <p style="margin: 0; padding-bottom: 15px; color: #8e8e8e; font-size: 11px;">
                By signing up, you agree to our **Terms**, **Privacy Policy** and **Cookies Policy**.
            </p>
        </form>
    </div>

    <div style="
        background-color: white; 
        border: 1px solid #dbdbdb; 
        border-radius: 1px; 
        width: 380px; 
        max-width: 100%;
        padding: 25px 0; 
        font-size: 15px; 
        text-align: center;
    ">
        Have an account? 
        <a href="login.html" style="color: #0095f6; text-decoration: none; font-weight: 600;">Log in</a>
    </div>

    <div style="
        margin-top: 25px; 
        text-align: center;
        width: 400px; 
        max-width: 100%;
    ">
        <p style="font-size: 15px; color: #262626; margin-bottom: 15px;">Get the app.</p>
        <div style="display: flex; justify-content: center; gap: 10px;">
            <a href="#" style="text-decoration: none;">
                <img src="appstore.png" alt="Download on the App Store" style="height: 40px;">
            </a>
            <a href="kaka.html" style="text-decoration: none;">
                <img src="googleplay.png" alt="Get it on Google Play" style="height: 40px;">
            </a>
            </div>
    </div>
    
    <footer style="
        margin-top: 64px; 
        width: 100%; 
        max-width: 935px; 
        text-align: center;
    ">
    </footer>

</body>
</html>
